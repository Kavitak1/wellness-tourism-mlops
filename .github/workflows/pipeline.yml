name: Wellness Tourism MLOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "models/**"
      - "reports/**"
      - "data/processed/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wellness-tourism-mlops
  cancel-in-progress: false

jobs:
  data-registration:
    name: Data registration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the registered dataset
        run: python -m src.validate_data

  data-preparation:
    name: Data preparation
    runs-on: ubuntu-latest
    needs: data-registration
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clean the data and write train and test splits
        run: python -m src.prepare_data

      - name: Publish train and test splits
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/
          retention-days: 14

  model-building:
    name: Model building
    runs-on: ubuntu-latest
    needs: data-preparation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the train and test artifact
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed

      - name: Tune models and save the best pipeline
        run: python -m src.train_model

      - name: Commit the best model back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.joblib models/model_metadata.json reports/experiment_log.json
          if git diff --staged --quiet; then
            echo "Model artifacts are unchanged."
          else
            git commit -m "Update the best Wellness Tourism model from the MLOps pipeline"
            git push origin HEAD:main
          fi
